name: ci

# Minimal merge gate, provisioned by grahambrooks/auto-managed (ensure_ci.sh).
# Dependency PRs cannot auto-merge without a green check, so every managed repo
# needs at least this. Edit freely — the control plane never overwrites it.

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install
        run: |
          if [ -f yarn.lock ]; then corepack enable && yarn install --immutable
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi
      - name: Build + test
        run: |
          npm run build --if-present
          npm test --if-present
